[package]
name = "stars-ui"
description = "Shared egui view code for Stars! (galaxy map, race wizard, production queue, browsers, reports) built on top of stars-core state. Compiles for both native and wasm frontends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
stars-core.workspace = true
stars-formats.workspace = true
# `egui` only — the immediate-mode widget library is pure Rust and builds
# anywhere. The native windowing stack (`eframe`) belongs to the shell crates,
# so this one stays cheap to build and test.
egui.workspace = true
